name: Publish sdist and wheels

env:
  # A tag or branch name or a commit hash for the scipy/scipy repo, for which
  # to build wheels. This is normally set to `main` in the main branch of this
  # repo, and to a tag name (e.g., `v2.3.2`) on a release branch.
  SOURCE_REF_TO_BUILD: main
  UV_VERSION: "0.12.5"
  UV_HASH: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"

on:
  schedule:
    #        ┌───────────── minute (0 - 59)
    #        │  ┌───────────── hour (0 - 23)
    #        │  │ ┌───────────── day of the month (1 - 31)
    #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #        │  │ │ │ │
    - cron: "9  9 * * 1,4"
  pull_request:
    branches:
      - main
      - maintenance/**
  push:
    branches:
      - main  # FOR TESTING ONLY
  workflow_dispatch:
    inputs:
      environment:
        description: Which PyPI environment to upload to, if any
        required: true
        type: choice
        options: ["none", "testpypi", "pypi"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  check_lock:
    name: Check uv.lock file
    runs-on: ubuntu-latest
    if: (github.repository == 'scipy/scipy-release' || github.repository == '')

    steps:
      - name: Checkout scipy-release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout scipy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scipy/scipy
          ref: ${{ env.SOURCE_REF_TO_BUILD }}
          path: scipy-src
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          # unlike build_wheels, this job is Linux-only, so we can pin the download too
          checksum: ${{ env.UV_HASH }}
          enable-cache: false

      - name: Check lock file
        run: |
          # pyproject.toml holds the dependency groups the builds install, copied out
          # of scipy's; regenerating it here is what catches scipy changing them.
          # See CONTRIBUTING.md for how to regenerate these files. The cooldown the
          # lock was generated with is recorded in it, and has to be repeated here.
          python3 tools/sync_dependency_groups.py scipy-src | diff -u pyproject.toml -
          uv lock --check --exclude-newer "7 days"

      - name: Record the pins that will be used
        run: |
          # the packages that actually get installed, for review of a lock file bump
          {
            echo '## Build and test dependencies for this run'
            echo '```'
            uv export --frozen --no-hashes --no-emit-project --no-default-groups \
              --group build --group openblas32 --group test-core
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"


  build_wheels:
    name: BLD > ${{ matrix.python }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}-${{ matrix.buildplat[3] }}
    runs-on: ${{ matrix.buildplat[0] }}
    if: (github.repository == 'scipy/scipy-release' || github.repository == '')
    needs: [check_lock]
    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        # Github Actions doesn't support pairing matrix values together, let's improvise
        # https://github.com/github/feedback/discussions/7835#discussioncomment-1769026
        buildplat:
        # should also be able to do multi-archs on a single entry, e.g.
        # [windows-2025, win*, "AMD64 x86"]. However, those two require a different compiler setup
        # so easier to separate out here.
        - [ubuntu-24.04, manylinux, x86_64, "", ""]
        - [ubuntu-24.04, musllinux, x86_64, "", ""]
        - [ubuntu-24.04-arm, manylinux, aarch64, "", ""]
        - [ubuntu-24.04-arm, musllinux, aarch64, "", ""]
        - [macos-15-intel, macosx, x86_64, openblas, "10.15"]
        - [macos-15-intel, macosx, x86_64, accelerate, "14.0"]
        - [macos-14, macosx, arm64, openblas, "12.3"]
        - [macos-14, macosx, arm64, accelerate, "14.0"]
        - [windows-2025, win, AMD64, "", ""]
        - [windows-11-arm, win, ARM64, "", ""]
        python: ["cp312", "cp313", "cp314", "cp314t", "cp315", "cp315t"]

    steps:
      - name: Checkout scipy-release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout scipy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scipy/scipy
          ref: ${{ env.SOURCE_REF_TO_BUILD }}
          path: scipy-src
          submodules: true
          persist-credentials: false

      # the version of python we'll run cibuildwheel with
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13

      # Used in cibw_before_build to install pinned build dependencies
      # Note that cibuildwheel provides it in the Linux images, so this install
      # is only useful on macOS/windows
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # can't use checksum here, because there are different packages
          # for different OS
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Setup windows
        if: matrix.buildplat[1] == 'win'
        run: |
          echo "CC=clang-cl" >> $env:GITHUB_ENV
          echo "CXX=clang-cl" >> $env:GITHUB_ENV
          echo "TARGET_ARCH=${{ matrix.buildplat[2] }}" >> $env:GITHUB_ENV

          # workaround for https://github.com/scipy/scipy/issues/25067
          rm -fo c:/Strawberry/c/lib/pkgconfig/*.pc

          # pkg-config setup
          $CIBW = "${{ github.workspace }}/.openblas"
          # pkgconfig needs a complete path, and not just "./openblas since the
          # build is run in a tmp dir (?)
          # It seems somewhere in the env passing, `\` is not
          # passed through, so convert it to '/'
          $CIBW = $CIBW.replace("\","/")
          echo "CIBW_ENVIRONMENT_WINDOWS=PKG_CONFIG_PATH=$CIBW" >> $env:GITHUB_ENV

      - name: Setup macOS
        if: startsWith( matrix.buildplat[0], 'macos-' )
        env:
          BLAS_VARIANT: ${{ matrix.buildplat[3] }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.buildplat[4] }}
        run: |
          if [[ "${BLAS_VARIANT}" == "accelerate" ]]; then
            echo CIBW_CONFIG_SETTINGS=\"setup-args=-Dblas=accelerate\" >> "$GITHUB_ENV"

            # Builds with Accelerate only target macOS>=14.0
            CIBW_ENV="CIBW_ENVIRONMENT_MACOS=MACOSX_DEPLOYMENT_TARGET=14.0 INSTALL_OPENBLAS=false"
          else
            CIBW_ENV="CIBW_ENVIRONMENT_MACOS=PKG_CONFIG_PATH=$PWD/.openblas \
              MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}""
          fi
          echo "$CIBW_ENV" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.buildplat[1] }}*
          CIBW_ARCHS: ${{ matrix.buildplat[2] }}
          CIBW_ENABLE: cpython-prerelease
        with:
           package-dir: scipy-src
           output-dir: dist
           config-file: cibuildwheel.toml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./dist/*.whl
          name: ${{ matrix.python }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}-${{ matrix.buildplat[3] }}-${{ matrix.buildplat[4] }}

# -------------------------------------------------------------------------------------
  # Should we upload to nightly. We do this on a scheduled run, or a workflow dispatch with environment 'none'
  nightly_upload:
    runs-on: ubuntu-latest
    if: github.repository == 'scipy/scipy-release' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'none'))
    needs: [build_wheels]

    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Upload nightly wheel
        uses: scientific-python/upload-nightly-action@e76cfec8a4611fd02808a801b0ff5a7d7c1b2d99 # 0.6.4
        with:
          anaconda_nightly_upload_token: ${{ secrets.SCIPY_NIGHTLY_UPLOAD_TOKEN }}
          artifacts_path: dist/

# -------------------------------------------------------------------------------------
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    if: github.repository == 'scipy/scipy-release'
    # this job installs with `--frozen`, which skips the lock file check
    needs: [check_lock]
    env:
      OPENBLAS: openblas32

    steps:
      - name: Checkout scipy-release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout scipy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scipy/scipy
          ref: ${{ env.SOURCE_REF_TO_BUILD }}
          path: scipy-src
          submodules: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          enable-cache: false

      - name: Set up OpenBLAS
        run: |
          # Apart from generating the .pc file below, nothing imports from this
          # environment: scipy only links against the shared library in it, and finds
          # it again at runtime through the rpath that the .pc file bakes in. So it is
          # kept separate, and has to outlive the build and test environments.
          export UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/.openblas-venv
          uv sync --python-preference only-managed --frozen --no-default-groups --group $OPENBLAS

          pkgconf_path=$GITHUB_WORKSPACE/.openblas
          rm -rf $pkgconf_path
          mkdir -p $pkgconf_path
          $UV_PROJECT_ENVIRONMENT/bin/python -c "import scipy_${OPENBLAS}; print(scipy_${OPENBLAS}.get_pkg_config())" > $pkgconf_path/scipy-openblas.pc
          echo "PKG_CONFIG_PATH=$pkgconf_path" >> "$GITHUB_ENV"

      - name: Build sdist
        run: |
          # use uv and a lock file to pin down all dependencies for the sdist build.
          # The lock file lives in this repo, so sync from here; the environment goes
          # into the scipy checkout, where `uv build --no-build-isolation` looks for it.
          # --frozen : uses specification in uv.lock as source of truth
          # only-managed: force uv to use a managed python. No version is requested, so
          #     it's uv's default managed CPython - i.e. UV_VERSION decides which Python
          #     the sdist is built and tested with; cibuildwheel isn't used in this job.
          export UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/scipy-src/.venv
          uv sync --python-preference only-managed --frozen --no-default-groups --group build

          cd scipy-src
          uv build --sdist --no-build-isolation .

      - name: Install the sdist
        run: |
          # the sdist build environment has done its job; removing it proves that the
          # test environment doesn't quietly depend on it
          rm -rf $GITHUB_WORKSPACE/scipy-src/.venv

          cd scipy-src/dist

          # build and install the sdist in a fresh venv, populated by the same
          # `uv sync` from the same lock file as the build environment above
          export UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/scipy-src/dist/test
          uv sync --project $GITHUB_WORKSPACE --python-preference only-managed --frozen --no-default-groups --group build --group test-core
          source test/bin/activate
          uv pip install --no-deps --no-build-isolation -v *.gz

      - name: Test the sdist
        run: |
          # each step gets a fresh shell, so re-enter the venv built above
          cd scipy-src/dist
          source test/bin/activate
          python -c "import scipy, sys; print(scipy.__version__); sys.exit(scipy.test() is False)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: scipy-src/dist/*.tar.gz

# -------------------------------------------------------------------------------------
  testpypi-publish:
    name: Publish release to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi'
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/scipy
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true
          attestations: true

# -------------------------------------------------------------------------------------
  check_version:
    name: Ensure commit is tag before upload to PyPi

    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi'
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scipy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scipy/scipy
          ref: ${{ env.SOURCE_REF_TO_BUILD }}
          path: scipy-src
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          persist-credentials: false

      - name: Examine git commit
        run: |
          cd scipy-src
          hash=$(git describe HEAD)
          echo $hash
          if [[ $hash == *"-"*"-"* ]]; then
            echo "SOURCE_REF_TO_BUILD is not a tag"
            exit 1
          else
            echo "SOURCE_REF_TO_BUILD is a tag"
          fi;

# -------------------------------------------------------------------------------------
  pypi-publish:
    name: Publish release to PyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi'
    needs: [check_version]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scipy
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
          attestations: true
